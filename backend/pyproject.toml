[project]
name = "turnos-backend"
version = "0.1.0"
description = "Backend FastAPI — turnos-odontologia"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "alembic",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
